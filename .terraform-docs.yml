formatter: "markdown document"

version: ""

header-from: ".header.md"
footer-from: ""

recursive:
  enabled: false
  path: modules
  include-main: true

sections:
  hide:
    - requirements
    - footer
  show: []
    
content: |-
  {{ .Header }}

  {{ .Resources }}

  {{ .Requirements }}

  ## Example Usage
  ```hcl
  {{ include "./examples/example.tf" }}
  ```

  {{ .Inputs }}

  {{ .Outputs }}

  {{ .Modules }}

  {{ .Footer }}

output:
  file: README.md
  mode: replace
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->
output-values:
  enabled: false
  from: ""

sort:
  enabled: true
  by: required

settings:
  anchor: true
  color: true
  default: true
  description: false
  escape: true
  hide-empty: false
  html: true
  indent: 1
  lockfile: false
  read-comments: true
  required: true
  sensitive: true
  type: true
